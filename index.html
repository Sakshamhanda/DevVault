<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="searchbar">
            <div class="input-btn">
                <form id="form">
                <input type="text" placeholder="Enter a Github username..."id="form-input">
                <button type="submit">Button</button>
                </form>
            </div>
        </div>
        <div id="githubcard">
            <img src="https://avatars.githubusercontent.com/u/180416757?v=4" alt="Profile pic" id="avatar">
            <div class="detail-card">
                <div id="username-card">
                    <div id="user-name">
                        <a href="https://github.com/Sakshamhanda"><div id="username">@Sakshamhanda</div></a>
                        <div id="bio">This is my bio</div>
                    </div>
                    <div id="joined-date">
                        04 Feb,2024
                    </div>
                    </div>
                <div id="tri-card">
                    <div class="repo-card" >
                        <div>Followings</div>
                        <div  id="following">5</div>
                    </div>
                    <div class="repo-card" >
                        <div>Followers</div>
                        <div  id="followers">4</div>

                    </div>
                    <div class="repo-card" >
                        <div>Repositories</div>
                        <div id="repo">9</div>
                    </div>
                </div>
                
                <div id="info-card">
                    <div id="address"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-geo-alt" viewBox="0 0 16 16">
                    <path d="M12.166 8.94c-.524 1.062-1.234 2.12-1.96 3.07A32 32 0 0 1 8 14.58a32 32 0 0 1-2.206-2.57c-.726-.95-1.436-2.008-1.96-3.07C3.304 7.867 3 6.862 3 6a5 5 0 0 1 10 0c0 .862-.305 1.867-.834 2.94M8 16s6-5.686 6-10A6 6 0 0 0 2 6c0 4.314 6 10 6 10"/>
                    <path d="M8 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4m0 1a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/></svg>Abohar</div>
                </div>
            </div>
            
        </div>
    </div>
<script src="script.js"></script>
</body>
</html>
